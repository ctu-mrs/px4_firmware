name: ros_package_build

on:

  push:
    branches: [ 1.15.4-dev ]

  pull_request:
    branches: [ 1.15.4-dev ]
    
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build:
    uses: ctu-mrs/ci_scripts/.github/workflows/ros_package_build.yml@ros2
    secrets:
      PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}